<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Greeting Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #e0e7ff 50%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 20px;
        }
        .greeting {
            font-size: 3rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
        }
        .logo {
            width: 128px;
            height: 128px;
            margin: 2rem auto;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.5s forwards;
        }
        .indus-text {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #2563eb, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 2.5s forwards;
        }
        .language-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-height: 256px;
            overflow-y: auto;
            opacity: 0;
            animation: fadeIn 1s ease-out 3.5s forwards;
        }
        .language-btn {
            padding: 12px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .language-btn:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .greeting, .logo, .indus-text, .language-grid {
            transform: translateY(32px);
        }
    </style>
</head>

    <div class="container">
        <div class="greeting">Namaste!</div>

        </div>
        <div class="indus-text">I N D U S</div>
        <h3 style="margin-bottom: 1.5rem; color: #374151;">Choose your preferred language</h3>
        <div class="language-grid">
            <div class="language-btn">
                <div style="font-weight: 500; color: #1f2937;">English</div>

            <div class="language-btn">

            <div class="language-btn">

            </div>
        </div>
    </div>
</body>
</html>
