[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  REACT_APP_API_URL = "http://localhost:10000"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview.environment]
  REACT_APP_API_URL = "http://localhost:10000"

[context.branch-deploy.environment]
  REACT_APP_API_URL = "http://localhost:10000"
